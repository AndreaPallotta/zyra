name: "Zyra CI Pipeline"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build Multi-Target Compiler
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm install

      - name: Run Core Test Suite (57 Native & JS Tests)
        working-directory: core
        run: npm test

      - name: Build Release Installers & Packaging Pipeline
        run: node packaging/build-packages.js
