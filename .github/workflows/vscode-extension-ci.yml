name: "vscode-ext:ci"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional git tag to create and push (e.g. v1.2.3)'
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Core
        run: npm run build -w core

      - name: Build Extension (with LSP Bundling)
        run: npm run build -w vscode


      - name: Create tag (optional)
        if: ${{ inputs.tag != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          git push origin --tags
