name: "Zyra Multi-Platform Release Pipeline"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

jobs:
  build-and-release:
    name: Build & Package Release Artifacts
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup Compiler
        run: choco install innosetup --no-progress -y

      - name: Resolve Release Version
        id: vars
        shell: bash
        run: |
          REF_VER="${{ github.ref_name || inputs.version }}"
          RAW_VER="${REF_VER#v}"
          echo "VERSION=v${RAW_VER}" >> $GITHUB_ENV
          echo "RAW_VERSION=${RAW_VER}" >> $GITHUB_ENV
          echo "VERSION=v${RAW_VER}" >> $GITHUB_OUTPUT
          echo "RAW_VERSION=${RAW_VER}" >> $GITHUB_OUTPUT

      - name: Extract Changelog Section from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          VERSION_TAG="${{ env.VERSION }}"
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_BODY=$(awk "/## \\[${VERSION_TAG}\\]/{flag=1; next} /## \\[/ {flag=0} flag" CHANGELOG.md | sed '/^---$/d')
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=No changelog entry found in CHANGELOG.md" >> $GITHUB_OUTPUT
          fi

      - name: Build All Release Packages
        run: node packaging/build-packages.js
        env:
          VERSION: ${{ env.VERSION }}

      - name: Create Linux Release Archive (.tar.gz)
        shell: bash
        run: |
          tar -czvf dist_packages/zyra-${{ env.VERSION }}-linux-x64.tar.gz -C core/bin zyra.exe

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Zyra Programming Language ${{ env.VERSION }} Release"
          tag_name: ${{ env.VERSION }}
          body: |
            ## Zyra Programming Language ${{ env.VERSION }} Release

            ### Installers & Package Manager
            - Windows Setup Wizard Executable: ZyraSetup.exe (Standard Windows Setup Wizard)
            - Windows App Installer Package: Zyra_${{ env.RAW_VERSION }}_x64.msix (Windows Store & App Installer format)
            - Zyra Package Manager (zyra add): Direct Rust Crate Interop (import rust "<crate>") & 150,000+ packages
            - Linux Web Installer: get.sh (curl -fsSL https://zyra-lang.dev/get | bash)
            - VS Code Extension: zyra-vscode-${{ env.RAW_VERSION }}.vsix (Syntax highlighting, IntelliSense, Hover docs, Code Lens Run button)

            ### Portable Archives
            - Windows Portable Zip: zyra-${{ env.VERSION }}-windows-x64.zip (Zero installation / offline standalone zip)
            - Linux Portable Archive: zyra-${{ env.VERSION }}-linux-x64.tar.gz (Zero installation / offline tarball)
            - Debian Package Structure: zyra_${{ env.RAW_VERSION }}_amd64 (Compatible with apt, dpkg, zypper)

            ### Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            dist_packages/ZyraSetup.exe
            dist_packages/Zyra_${{ env.RAW_VERSION }}_x64.msix
            dist_packages/zyra-${{ env.VERSION }}-windows-x64.zip
            dist_packages/zyra-vscode-${{ env.RAW_VERSION }}.vsix
            dist_packages/get.sh
            dist_packages/zyra-${{ env.VERSION }}-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
