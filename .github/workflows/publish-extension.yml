name: "vscode-ext:publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Core
        run: npm run build -w core

      - name: Build & Package Extension
        run: |
          npm run build -w vscode
          cd vscode && npx @vscode/vsce package

      - name: Publish to Marketplace
        run: |
          cd vscode && npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
