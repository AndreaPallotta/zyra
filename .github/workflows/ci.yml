name: "Zyra CI Pipeline"

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '**.md'

jobs:
  test-and-build:
    name: Build & Verify Native Compiler & Packaging
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Installers & Packaging Pipeline
        run: node packaging/build-packages.js
