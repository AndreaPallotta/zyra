name: "Zyra Multi-Platform Release Pipeline"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Package Release Artifacts
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Run Core Test Suite
        working-directory: core
        run: npm test

      - name: Build All Release Packages (ZyraSetup.exe, VSIX, get.sh, deb, zip)
        run: node packaging/build-packages.js

      - name: Create Linux Release Archive (.tar.gz)
        run: |
          tar -czvf dist_packages/zyra-v1.0.0-linux-x64.tar.gz -C core/bin zyra.exe

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Zyra Release ${{ github.ref_name || inputs.version }}"
          tag_name: ${{ github.ref_name || inputs.version }}
          body: |
            ## 🚀 Zyra Programming Language v1.0.0 Release

            ### 📦 Interactive Installers (Recommended)
            - 🪟 **Windows Installer Executable**: `ZyraSetup.exe` (Automatic PATH registration & VS Code prompt)
            - 🐧 **Linux Web Installer**: `get.sh` (`curl -fsSL https://zyra-lang.dev/get | bash`)
            - 📦 **VS Code Extension**: `zyra-vscode-1.0.2.vsix` (Syntax highlighting, IntelliSense, Hover docs, Code Lens `▶ Run` button)

            ### 💼 Offline & Enterprise Portable Archives
            - 🪟 **Windows Portable Zip**: `zyra-v1.0.0-windows-x64.zip` (Zero installation / offline standalone zip)
            - 🐧 **Linux Portable Archive**: `zyra-v1.0.0-linux-x64.tar.gz` (Zero installation / offline tarball)
            - 🐧 **Debian Package Structure**: `zyra_1.0.0_amd64` (Compatible with `apt`, `dpkg`, `zypper`)
          files: |
            dist_packages/ZyraSetup.exe
            dist_packages/zyra-v1.0.0-windows-x64.zip
            dist_packages/zyra-vscode-1.0.2.vsix
            dist_packages/get.sh
            dist_packages/zyra-v1.0.0-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
